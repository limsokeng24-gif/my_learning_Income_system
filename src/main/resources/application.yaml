server:
  port: 9091

spring:
  application:
    name: overseas-language-centre

  datasource:
    url: jdbc:postgresql://localhost:5432/overseas-centre
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa: #this one use for create table auto in database
#    hibernate:
#      ddl-auto: update #use create only for testing
    show-sql: true
    properties:
      hibernate:
        format_aql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:/db.changelog/db.changelog-master.yaml
    enabled:
    data:
      redis:
        host: localhost
        port: 6379
        password:
        timeout: 2s

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes-please}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} #use for 15minute
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} #use for 7days